name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cuda:
    # No GPU on hosted runners: this job proves the source compiles and that
    # both advertised architectures end up inside the executable, and it runs
    # the input-handling cases that never touch the device.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.0'
          method: 'network'

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Both architectures are embedded
        shell: pwsh
        run: |
          $cubins = & "$env:CUDA_PATH\bin\cuobjdump.exe" -lelf ntt_gpu.exe
          $cubins | Write-Host
          if (-not ($cubins -match 'sm_50')) { throw 'sm_50 (Maxwell) cubin is missing' }
          if (-not ($cubins -match 'sm_75')) { throw 'sm_75 (Turing) cubin is missing' }

      - name: Input handling (CPU only)
        shell: pwsh
        run: python tests/run_tests.py --errors-only
